<!DOCTYPE html>
<html>
<head>
    <title>Clear Dashboard Cache</title>
    <style>
        body { font-family: system-ui; padding: 40px; background: #0c0c0f; color: #fff; text-align: center; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; background: #ef4444; color: white; border: none; border-radius: 8px; margin: 10px; }
        button:hover { background: #dc2626; }
        .success { background: #10b981; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .error { background: #ef4444; padding: 15px; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🗑️ Clear Dashboard Cache</h1>
    <p>This will force the backend to fetch fresh data from your integrations</p>
    
    <button onclick="clearCache()">Clear Cache & Reload</button>
    
    <div id="status"></div>

    <script>
        async function clearCache() {
            const status = document.getElementById('status');
            status.innerHTML = '<div style="color: #fbbf24;">⏳ Clearing cache...</div>';
            
            try {
                const tokens = JSON.parse(localStorage.getItem('wp_tokens') || 'null');
                const token = tokens?.accessToken;
                
                if (!token) {
                    status.innerHTML = '<div class="error">❌ Not logged in. Please log in at http://localhost:5173 first, then come back here.</div>';
                    return;
                }
                
                const response = await fetch('http://localhost:8000/api/v1/dashboard/invalidate-cache', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    status.innerHTML = '<div class="success">✅ Cache cleared! Redirecting to dashboard in 2 seconds...</div>';
                    setTimeout(() => {
                        window.location.href = 'http://localhost:5173';
                    }, 2000);
                } else {
                    status.innerHTML = '<div class="error">❌ Failed to clear cache</div>';
                }
                
            } catch (error) {
                status.innerHTML = `<div class="error">❌ Error: ${error.message}<br><br>Make sure backend is running at http://localhost:8000</div>`;
            }
        }
    </script>
</body>
</html>
